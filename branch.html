<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Branch - Last-Minute Hub</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // Apply dark mode immediately to prevent flash
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          // Add to both html and body to ensure it works
          document.documentElement.classList.add('dark-mode');
          document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('dark-mode');
          });
        }
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <h1 id="branch-name">Branch</h1>
        <a href="index.html" class="back-link">← Home</a>
        <button
          id="dark-mode-toggle"
          class="dark-mode-btn"
          title="Toggle Dark Mode"
        >
          🌙
        </button>
      </div>
    </header>

    <main class="container">
      <section class="section">
        <h2>Select Year</h2>
        <div id="year-options" class="option-container"></div>
      </section>

      <section id="subjects-section" class="section" style="display: none">
        <h2>Subjects</h2>
        <div id="subject-list" class="materials-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Made with ❤️ by Team Last-Minute Hub</p>
    </footer>

    <script src="script.js"></script>
    <script src="notification-system.js"></script>
    <script src="notification-ui.js"></script>
    <script src="timetable-parser.js"></script>
  </body>
</html>
